<svg viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #9aa4b2; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .archive { fill: #f2f4f8; stroke: #4b5563; stroke-width: 1.5; }
      .dynamic { fill: #e8eefc; stroke: #3b5bdb; stroke-width: 1.8; }
      .static { fill: #fdf1e7; stroke: #b45309; stroke-width: 1.8; }
      .exe { fill: #e6f6ee; stroke: #15803d; stroke-width: 1.8; }
      .bad { fill: #fdeaea; stroke: #b91c1c; stroke-width: 2; }
      .text { fill: #1f2430; font-size: 12.5px; }
      .label { fill: #1f2430; font-size: 13.5px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .title { fill: #1f2430; font-size: 18px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .panel-title { fill: #1f2430; font-size: 15px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .caption { fill: #4b5563; font-size: 12.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .dim { fill: #6b7684; font-size: 11.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .warn { fill: #b91c1c; font-size: 12.5px; font-weight: 700; }
      .ok { fill: #15803d; font-size: 12.5px; font-weight: 700; }
      .edge { stroke: #4b5563; stroke-width: 1.6; fill: none; }
      .bad-edge { stroke: #b91c1c; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .arrowhead { fill: #4b5563; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="640"/>
  <text class="title" x="550" y="28">Two binaries, two CRTs — the FFI archive has to match whichever it's linked into</text>

  <!-- BEFORE -->
  <rect class="panel" x="30" y="55" width="1040" height="230" rx="10"/>
  <text class="panel-title" x="550" y="80">Before the fix: cc's default (dynamic CRT) archive, used both ways</text>

  <rect class="dynamic" x="55" y="105" width="260" height="70" rx="8"/>
  <text class="label" x="70" y="128">calc_ffi archive</text>
  <text class="text" x="70" y="150">cc default: dynamic CRT</text>
  <text class="dim" x="70" y="165">wants ucrtbase.dll at run time</text>

  <path class="edge" d="M315,140 L400,140" marker-end="url(#arrow)"/>
  <rect class="exe" x="410" y="105" width="230" height="70" rx="8"/>
  <text class="label" x="425" y="128">calcc.exe (ordinary build)</text>
  <text class="ok" x="425" y="152">OK — rustc also defaults</text>
  <text class="ok" x="425" y="167">to the dynamic CRT here</text>

  <rect class="dynamic" x="55" y="205" width="260" height="70" rx="8"/>
  <text class="label" x="70" y="228">calc_compiler_calc_ffi archive</text>
  <text class="text" x="70" y="250">cc default: DYNAMIC CRT</text>
  <text class="dim" x="70" y="265">same default as calc_ffi, above</text>

  <path class="bad-edge" d="M315,240 L400,240" marker-end="url(#arrow)"/>
  <rect class="bad" x="410" y="195" width="620" height="80" rx="8"/>
  <text class="label" x="425" y="218">prog.exe (link_stub.rs&#8217;s explicit static-CRT link)</text>
  <text class="text" x="425" y="238">/nologo libcmt.lib libvcruntime.lib libucrt.lib ...</text>
  <text class="warn" x="425" y="260">LNK4098: defaultlib 'msvcrt.lib' conflicts with use of other libs</text>

  <!-- AFTER -->
  <rect class="panel" x="30" y="310" width="1040" height="290" rx="10"/>
  <text class="panel-title" x="550" y="335">After the fix: each archive matches its own consumer's CRT</text>

  <rect class="dynamic" x="55" y="365" width="260" height="80" rx="8"/>
  <text class="label" x="70" y="388">calc_ffi archive</text>
  <text class="text" x="70" y="410">calc-runtime/build.rs:</text>
  <text class="text" x="70" y="426">cc default (dynamic) — unchanged</text>

  <path class="edge" d="M315,405 L400,405" marker-end="url(#arrow)"/>
  <rect class="exe" x="410" y="365" width="230" height="80" rx="8"/>
  <text class="label" x="425" y="388">calcc.exe, test binaries</text>
  <text class="ok" x="425" y="412">OK — matches rustc&#8217;s own</text>
  <text class="ok" x="425" y="427">dynamic-CRT default</text>

  <rect class="static" x="55" y="475" width="260" height="90" rx="8"/>
  <text class="label" x="70" y="498">calc_compiler_calc_ffi archive</text>
  <text class="text" x="70" y="520">calc-compiler/build.rs:</text>
  <text class="text" x="70" y="536">.static_crt(true): STATIC CRT</text>
  <text class="dim" x="70" y="552">changed to match its consumer, below</text>

  <path class="edge" d="M315,520 L400,520" marker-end="url(#arrow)"/>
  <rect class="exe" x="410" y="475" width="620" height="90" rx="8"/>
  <text class="label" x="425" y="498">prog.exe (link_stub.rs&#8217;s explicit static-CRT link)</text>
  <text class="text" x="425" y="520">/nologo libcmt.lib libvcruntime.lib libucrt.lib ...</text>
  <text class="ok" x="425" y="544">no warning — every input now agrees on the static CRT</text>

  <text class="caption" x="550" y="620" text-anchor="middle">Same C source, same two archives as the previous diagram — only the CRT setting differs, chosen per consumer.</text>
</svg>
