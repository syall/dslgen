<svg viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>calc-lang built-ins and linking after session A12</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f2f4f8; stroke: #4b5563; stroke-width: 1.2; }
      .new { fill: #e6f4ef; stroke: #0f6e56; stroke-width: 1.2; }
      .label { fill: #1f2430; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .caption { fill: #4b5563; font-size: 11.5px; text-anchor: middle; }
      .note { fill: #4b5563; font-size: 11.5px; }
      .edge { stroke: #4b5563; stroke-width: 1.5; fill: none; }
      .rule { stroke: #9ca3af; stroke-width: 0.8; stroke-dasharray: 3 4; }
      .arrowhead { fill: #4b5563; }
    </style>
  </defs>
  <rect class="bg" width="680" height="830"/>
  <rect class="box" x="240" y="40" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="63">calc-compiler (calcc)</text>
  <text class="caption" x="340" y="81">backends, link.rs</text>
  <rect class="box" x="40" y="150" width="180" height="56" rx="6"/>
  <text class="label" x="130" y="173">calc-ir</text>
  <text class="caption" x="130" y="191">interpreter</text>
  <rect class="new" x="410" y="150" width="190" height="56" rx="6"/>
  <text class="label" x="505" y="173">calc-runtime-artifacts</text>
  <text class="caption" x="505" y="191">builds runtime archive</text>
  <rect class="box" x="240" y="260" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="283">calc-runtime</text>
  <text class="caption" x="340" y="301">implementations only</text>
  <rect class="new" x="240" y="370" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="393">calc-builtins</text>
  <text class="caption" x="340" y="411">manifest data only</text>
  <polyline class="edge" points="280,96 280,123 130,123 130,148" marker-end="url(#arrow)"/>
  <polyline class="edge" points="400,96 400,123 505,123 505,148" marker-end="url(#arrow)"/>
  <polyline class="edge" points="440,68 625,68 625,398 442,398" marker-end="url(#arrow)"/>
  <polyline class="edge" points="130,206 130,288 238,288" marker-end="url(#arrow)"/>
  <polyline class="edge" points="505,206 505,288 442,288" marker-end="url(#arrow)"/>
  <polyline class="edge" points="340,316 340,368" marker-end="url(#arrow)"/>
  <polyline class="edge" points="70,206 70,398 238,398" marker-end="url(#arrow)"/>
  <line class="rule" x1="40" y1="460" x2="640" y2="460"/>
  <text class="note" x="40" y="482">Linking a .calc program</text>
  <rect class="box" x="35" y="500" width="145" height="56" rx="6"/>
  <text class="label" x="107.5" y="523">runtime archive</text>
  <text class="caption" x="107.5" y="541">Cargo-built</text>
  <rect class="new" x="190" y="500" width="145" height="56" rx="6"/>
  <text class="label" x="262.5" y="523">link-deps file</text>
  <text class="caption" x="262.5" y="541">derived by rustc</text>
  <rect class="box" x="345" y="500" width="145" height="56" rx="6"/>
  <text class="label" x="417.5" y="523">calc_ffi archive</text>
  <text class="caption" x="417.5" y="541">deps in manifest</text>
  <rect class="new" x="500" y="500" width="145" height="56" rx="6"/>
  <text class="label" x="572.5" y="523">IPC bundle object</text>
  <text class="caption" x="572.5" y="541">generated by calcc</text>
  <rect class="box" x="240" y="610" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="633">link.rs</text>
  <text class="caption" x="340" y="651">no hardcoded libraries</text>
  <rect class="box" x="240" y="720" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="743">program.exe</text>
  <text class="caption" x="340" y="761">one file; needs python</text>
