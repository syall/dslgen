  <polyline class="edge" points="262.5,556 262.5,608" marker-end="url(#arrow)"/>
  <polyline class="edge" points="417.5,556 417.5,608" marker-end="url(#arrow)"/>
  <polyline class="edge" points="572.5,556 572.5,638 442,638" marker-end="url(#arrow)"/>
  <polyline class="edge" points="340,666 340,718" marker-end="url(#arrow)"/>
  <line class="edge" x1="40" y1="806" x2="80" y2="806"/>
  <text class="note" x="88" y="810">Cargo dependency / link input</text>
  <rect class="new" x="300" y="798" width="16" height="16" rx="3"/>
  <text class="note" x="324" y="810">new in A12</text>
