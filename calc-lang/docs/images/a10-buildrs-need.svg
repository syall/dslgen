<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #9aa4b2; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .rustbox { fill: #f2f4f8; stroke: #4b5563; stroke-width: 1.5; }
      .cbox { fill: #fdf1e7; stroke: #b45309; stroke-width: 1.6; }
      .buildbox { fill: #e8eefc; stroke: #3b5bdb; stroke-width: 1.8; }
      .text { fill: #1f2430; font-size: 12.5px; }
      .label { fill: #1f2430; font-size: 13.5px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .title { fill: #1f2430; font-size: 18px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .panel-title { fill: #1f2430; font-size: 15px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .caption { fill: #4b5563; font-size: 12.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .dim { fill: #6b7684; font-size: 11.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .edge { stroke: #4b5563; stroke-width: 1.6; fill: none; }
      .arrowhead { fill: #4b5563; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540"/>
  <text class="title" x="550" y="28">Why calc-runtime needs its own build.rs now</text>

  <!-- LEFT: A9 -->
  <rect class="panel" x="30" y="55" width="480" height="455" rx="10"/>
  <text class="panel-title" x="270" y="80">A9 — calc_add: Rust calling Rust</text>

  <rect class="rustbox" x="55" y="100" width="430" height="80" rx="8"/>
  <text class="label" x="70" y="123">calc-runtime/src/lib.rs</text>
  <text class="text" x="70" y="145">pub extern "C" fn calc_add(a, b) -&gt; f64 { a + b }</text>
  <text class="dim" x="70" y="163">eval: |args| calc_add(args[0], args[1])</text>

  <path class="edge" d="M270,180 L270,235" marker-end="url(#arrow)"/>
  <text class="caption" x="285" y="212">same Cargo</text>
  <text class="caption" x="285" y="228">build graph</text>

  <rect class="rustbox" x="55" y="245" width="430" height="80" rx="8"/>
  <text class="label" x="70" y="268">calc-ir::interp (the interpreter)</text>
  <text class="text" x="70" y="290">(builtin.eval)(&amp;args)</text>
  <text class="dim" x="70" y="308">a plain Rust call — just another crate dependency</text>

  <text class="caption" x="270" y="360" text-anchor="middle">No archive. No linker. No undefined symbol.</text>
  <text class="caption" x="270" y="380" text-anchor="middle">"one crate depends on another" is already enough.</text>

  <rect class="rustbox" x="55" y="405" width="430" height="68" rx="8"/>
  <text class="dim" x="70" y="428">calc-compiler/build.rs (A9) still builds a *second*,</text>
  <text class="dim" x="70" y="446">separate staticlib copy — but only for link_stub.rs,</text>
  <text class="dim" x="70" y="463">not for the path above.</text>

  <!-- RIGHT: A10 -->
  <rect class="panel" x="560" y="55" width="510" height="455" rx="10"/>
  <text class="panel-title" x="815" y="80">A10 — calc_sub: Rust calling C</text>

  <rect class="cbox" x="585" y="100" width="460" height="70" rx="8"/>
  <text class="label" x="600" y="122">calc-runtime/native/calc_ffi.c</text>
  <text class="text" x="600" y="144">double calc_sub(double a, double b)</text>
  <text class="text" x="600" y="161">  { return a - b; }</text>

  <path class="edge" d="M815,170 L815,192" marker-end="url(#arrow)"/>

  <rect class="rustbox" x="585" y="192" width="460" height="70" rx="8"/>
  <text class="label" x="600" y="214">calc-runtime/src/lib.rs</text>
  <text class="text" x="600" y="236">extern "C" { fn calc_sub(a, b) -&gt; f64; }</text>
  <text class="dim" x="600" y="253">eval: |args| unsafe { calc_sub(args[0], args[1]) }</text>

  <path class="edge" d="M815,262 L815,284" marker-end="url(#arrow)"/>

  <rect class="buildbox" x="585" y="284" width="460" height="70" rx="8"/>
  <text class="label" x="600" y="306">calc-runtime/build.rs — new this session</text>
  <text class="text" x="600" y="328">cc::Build::new().file(&#8230;).compile("calc_ffi")</text>
  <text class="dim" x="600" y="345">compiles the C file, links its archive in</text>

  <path class="edge" d="M815,354 L815,376" marker-end="url(#arrow)"/>

  <rect class="rustbox" x="585" y="376" width="460" height="70" rx="8"/>
  <text class="label" x="600" y="398">calc-ir::interp (the interpreter)</text>
  <text class="text" x="600" y="420">(builtin.eval)(&amp;args)</text>
  <text class="dim" x="600" y="437">same call site as A9 — only what eval resolves to differs</text>

  <text class="caption" x="815" y="468" text-anchor="middle">Even an in-process caller needs a real link step</text>
  <text class="caption" x="815" y="486" text-anchor="middle">to reach a symbol whose only definition is C.</text>
</svg>
