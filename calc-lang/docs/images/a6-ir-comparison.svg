<svg viewBox="0 0 1070 780" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      .box { fill: #f2f4f8; stroke: #4b5563; stroke-width: 1.5; }
      .ifbox { fill: #e8eefc; stroke: #3b5bdb; stroke-width: 1.8; }
      .nestbox { fill: #ffffff; stroke: #8891a0; stroke-width: 1.3; }
      .text { fill: #1f2430; font-size: 12px; }
      .label { fill: #1f2430; font-size: 12.5px; font-weight: 600; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .title { fill: #1f2430; font-size: 17px; font-weight: 700; font-family: -apple-system, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .subtitle { fill: #4b5563; font-size: 13px; font-style: italic; text-anchor: middle; }
      .caption { fill: #4b5563; font-size: 12.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; }
      .note { fill: #6b7684; font-size: 11px; font-style: italic; }
      .edge { stroke: #4b5563; stroke-width: 1.6; fill: none; }
      .edgelabel { fill: #4b5563; font-size: 11.5px; font-family: -apple-system, Helvetica, Arial, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .divider { stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .arrowhead { fill: #4b5563; }
      /* Equivalence colors: the same class marks the same thing on both sides,
         used instead of drawing a connecting line between them. */
      .eq-const { fill: #0f766e; font-size: 12px; font-weight: 700; }
      .eq-branch { fill: #7c3aed; font-size: 12px; font-weight: 700; }
      .eq-then { fill: #a4160a; font-size: 12px; font-weight: 700; }
      .eq-else { fill: #b8860b; font-size: 12px; font-weight: 700; }
      .eq-result { fill: #3b5bdb; font-size: 12px; font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        .box { fill: #262b36; stroke: #9aa5b1; }
        .ifbox { fill: #24304f; stroke: #8fa4ff; }
        .nestbox { fill: #1c202a; stroke: #6b7684; }
        .text { fill: #e8eaf0; }
        .label { fill: #f2f4f8; }
        .title { fill: #f5f6f8; }
        .subtitle { fill: #b7c0cc; }
        .caption { fill: #b7c0cc; }
        .note { fill: #9aa5b1; }
        .edge { stroke: #b7c0cc; }
        .edgelabel { fill: #b7c0cc; stroke: #1c202a; }
        .divider { stroke: #5a636e; }
        .arrowhead { fill: #b7c0cc; }
        .eq-const { fill: #5eead4; }
        .eq-branch { fill: #c4b5fd; }
        .eq-then { fill: #ff8a75; }
        .eq-else { fill: #e8b84b; }
        .eq-result { fill: #8fa4ff; }
      }
    </style>
  </defs>

  <text x="535" y="24" class="subtitle">same program both sides: { let x = 1; if x { x + 1 } else { 2 } }</text>
  <line x1="535" y1="40" x2="535" y2="670" class="divider"/>

  <!-- LEFT: calc-ir, a nested tree -->
  <text x="265" y="60" class="title">calc-ir (A4): a nested tree</text>

  <rect x="30" y="80" width="470" height="480" rx="10" class="box"/>
  <text x="45" y="102" class="label">Block (body)</text>
  <text x="50" y="126" class="eq-const">t0 = const 1.0</text>

  <rect x="50" y="140" width="430" height="370" rx="8" class="ifbox"/>
  <text x="62" y="162" class="label eq-branch">If  ·  dst = t1  ·  cond = t0</text>

  <rect x="68" y="180" width="200" height="180" rx="6" class="nestbox"/>
  <text x="78" y="200" class="label">then_block</text>
  <text x="78" y="222" class="text">t2 = const 1.0</text>
  <text x="78" y="242" class="text">t3 = t0 + t2</text>
  <text x="78" y="264" class="eq-then">Copy t1 = t3</text>

  <rect x="290" y="180" width="170" height="180" rx="6" class="nestbox"/>
  <text x="300" y="200" class="label">else_block</text>
  <text x="300" y="222" class="text">t4 = const 2.0</text>
  <text x="300" y="264" class="eq-else">Copy t1 = t4</text>

  <text x="50" y="535" class="eq-result">result: t1</text>

  <text x="30" y="600" class="caption">
    <tspan x="30" dy="0">One instruction (`If`) contains two whole nested</tspan>
    <tspan x="30" dy="18">`Block`s — the tree is two levels deep at exactly</tspan>
    <tspan x="30" dy="18">one place. Both branches write `t1` by hand via</tspan>
    <tspan x="30" dy="18"><tspan class="eq-then">Copy</tspan> — "phi via copies" (see `DECISIONS.md`, A4).</tspan>
  </text>

  <!-- RIGHT: Cranelift IR, a flat block graph -->
  <text x="805" y="60" class="title">Cranelift IR: a flat block graph</text>

  <rect x="680" y="90" width="240" height="120" rx="8" class="box"/>
  <text x="692" y="112" class="label">block0 (entry)</text>
  <text x="692" y="134" class="eq-const">v0 = f64const 1.0</text>
  <text x="692" y="152" class="text">v1 = f64const 0.0</text>
  <text x="692" y="170" class="eq-branch">v2 = fcmp ne v0, v1</text>
  <text x="692" y="188" class="eq-branch">brif v2, block1, block2</text>

  <rect x="590" y="270" width="220" height="140" rx="8" class="box"/>
  <text x="602" y="290" class="label">block1 (then)</text>
  <text x="602" y="312" class="text">v3 = f64const 1.0</text>
  <text x="602" y="330" class="text">v4 = fadd v0, v3</text>
  <text x="602" y="350" class="eq-then">def_var(t1, v4)</text>
  <text x="602" y="370" class="text">jump block3</text>

  <rect x="820" y="270" width="220" height="110" rx="8" class="box"/>
  <text x="832" y="290" class="label">block2 (else)</text>
  <text x="832" y="312" class="text">v5 = f64const 2.0</text>
  <text x="832" y="332" class="eq-else">def_var(t1, v5)</text>
  <text x="832" y="352" class="text">jump block3</text>

  <rect x="690" y="460" width="260" height="130" rx="8" class="ifbox"/>
  <text x="702" y="482" class="label">block3 (merge)</text>
  <text x="702" y="504" class="eq-result">v6 = use_var(t1)</text>
  <text x="702" y="520" class="note">; phi resolved automatically</text>
  <text x="702" y="542" class="eq-result">return v6</text>

  <line x1="740" y1="210" x2="700" y2="270" class="edge" marker-end="url(#arrow)"/>
  <text x="700" y="240" class="edgelabel">brif · true</text>

  <line x1="860" y1="210" x2="915" y2="270" class="edge" marker-end="url(#arrow)"/>
  <text x="880" y="240" class="edgelabel">brif · false</text>

  <line x1="700" y1="410" x2="750" y2="460" class="edge" marker-end="url(#arrow)"/>
  <text x="700" y="435" class="edgelabel">jump</text>

  <line x1="920" y1="380" x2="875" y2="460" class="edge" marker-end="url(#arrow)"/>
  <text x="895" y="425" class="edgelabel">jump</text>

  <text x="805" y="630" class="caption">
    <tspan x="805" dy="0" text-anchor="middle">Four sibling blocks linked by real branches. `block3`</tspan>
    <tspan x="805" dy="18" text-anchor="middle">has two predecessors, so reading `t1`'s <tspan class="eq-result">Variable</tspan> there</tspan>
    <tspan x="805" dy="18" text-anchor="middle">is what triggers Cranelift's own SSA-construction.</tspan>
  </text>

  <text x="535" y="712" class="caption" text-anchor="middle">
    Same source, two shapes: a tree with one nesting point, vs. a graph where any block can have multiple predecessors —
  </text>
  <text x="535" y="730" class="caption" text-anchor="middle">
    exactly why Cranelift needs, and provides, real SSA-construction machinery that calc-ir's structured `If` never had to.
  </text>

  <!-- Legend: color, not lines, marks what's the same thing on both sides. -->
  <circle cx="185" cy="758" r="4" class="eq-const"/>
  <text x="195" y="762" class="caption">t0 / v0</text>

  <circle cx="290" cy="758" r="4" class="eq-branch"/>
  <text x="300" y="762" class="caption">condition + branch</text>

  <circle cx="470" cy="758" r="4" class="eq-then"/>
  <text x="480" y="762" class="caption">then: Copy / def_var</text>

  <circle cx="660" cy="758" r="4" class="eq-else"/>
  <text x="670" y="762" class="caption">else: Copy / def_var</text>

  <circle cx="850" cy="758" r="4" class="eq-result"/>
  <text x="860" y="762" class="caption">result / return</text>
</svg>
