<svg viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>calc-lang built-ins and linking before session A12</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-red"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f2f4f8; stroke: #4b5563; stroke-width: 1.2; }
      .problem { fill: #fdecea; stroke: #b42318; stroke-width: 1.2; }
      .new { fill: #e6f4ef; stroke: #0f6e56; stroke-width: 1.2; }
      .label { fill: #1f2430; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .caption { fill: #4b5563; font-size: 11.5px; text-anchor: middle; }
      .note { fill: #4b5563; font-size: 11.5px; }
      .edge { stroke: #4b5563; stroke-width: 1.5; fill: none; }
      .reads { stroke: #b42318; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .rule { stroke: #9ca3af; stroke-width: 0.8; stroke-dasharray: 3 4; }
      .arrowhead { fill: #4b5563; }
      .arrowhead-red { fill: #b42318; }
    </style>
  </defs>
  <rect class="bg" width="680" height="720"/>
  <rect class="box" x="240" y="40" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="63">calc-compiler (calcc)</text>
  <text class="caption" x="340" y="81">backends, link_stub.rs</text>
  <rect class="problem" x="460" y="40" width="180" height="56" rx="6"/>
  <text class="label" x="550" y="63">compiler build.rs</text>
  <text class="caption" x="550" y="81">bare rustc + second cc</text>
  <rect class="box" x="40" y="150" width="180" height="56" rx="6"/>
  <text class="label" x="130" y="173">calc-ir</text>
  <text class="caption" x="130" y="191">interpreter</text>
  <rect class="problem" x="240" y="260" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="283">calc-runtime</text>
  <text class="caption" x="340" y="301">manifest + impls fused</text>
  <polyline class="edge" points="280,96 280,123 130,123 130,148" marker-end="url(#arrow)"/>
  <polyline class="edge" points="360,96 360,258" marker-end="url(#arrow)"/>
  <polyline class="edge" points="130,206 130,288 238,288" marker-end="url(#arrow)"/>
  <polyline class="reads" points="550,96 550,288 442,288" marker-end="url(#arrow-red)"/>
  <text class="note" x="540" y="190" text-anchor="end">reads its files</text>
  <line class="rule" x1="40" y1="350" x2="640" y2="350"/>
  <text class="note" x="40" y="372">Linking a .calc program</text>
  <rect class="box" x="40" y="390" width="180" height="56" rx="6"/>
  <text class="label" x="130" y="413">calc_runtime.lib</text>
  <text class="caption" x="130" y="431">bare rustc: no deps</text>
  <rect class="box" x="250" y="390" width="180" height="56" rx="6"/>
  <text class="label" x="340" y="413">calc_ffi archive</text>
  <text class="caption" x="340" y="431">second cc build</text>
  <rect class="problem" x="460" y="390" width="180" height="56" rx="6"/>
  <text class="label" x="550" y="413">system libs</text>
  <text class="caption" x="550" y="431">hardcoded list</text>
  <rect class="box" x="240" y="500" width="200" height="56" rx="6"/>
  <text class="label" x="340" y="523">link_stub.rs</text>
  <text class="caption" x="340" y="541">+ object file</text>
  <rect class="box" x="240" y="610" width="200" height="44" rx="6"/>
  <text class="label" x="340" y="637">program.exe</text>
  <polyline class="edge" points="130,446 130,528 238,528" marker-end="url(#arrow)"/>
  <polyline class="edge" points="340,446 340,498" marker-end="url(#arrow)"/>
  <polyline class="edge" points="550,446 550,528 442,528" marker-end="url(#arrow)"/>
  <polyline class="edge" points="340,556 340,608" marker-end="url(#arrow)"/>
  <line class="edge" x1="40" y1="688" x2="80" y2="688"/>
  <text class="note" x="88" y="692">Cargo dependency / link input</text>
  <line class="reads" x1="290" y1="688" x2="330" y2="688"/>
  <text class="note" x="338" y="692">reads another crate's files</text>
  <rect class="problem" x="520" y="680" width="16" height="16" rx="3"/>
  <text class="note" x="544" y="692">coupling problem</text>
</svg>
