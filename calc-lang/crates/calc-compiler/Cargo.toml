[package]
name = "calc-compiler"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "calcc"
path = "src/main.rs"

[dependencies]
calc-syntax = { path = "../calc-syntax" }
calc-ir = { path = "../calc-ir" }
calc-runtime = { path = "../calc-runtime" }
cranelift-codegen = { version = "0.135.2", optional = true }
cranelift-frontend = { version = "0.135.2", optional = true }
cranelift-module = { version = "0.135.2", optional = true }
cranelift-object = { version = "0.135.2", optional = true }
cranelift-native = { version = "0.135.2", optional = true }
target-lexicon = "0.13.5"
cc = "1.4.6"
inkwell = { version = "0.10", default-features = false, features = ["llvm21-1", "target-x86"], optional = true }

# Each codegen backend is a Cargo feature (spec.md §8.1), so a build pulls in only the
# backends it asks for. Cranelift is pure Rust and on by default (spec.md §14 #4, see
# DECISIONS.md's A8 entry); LLVM is a huge external C++ dependency, so it's opt-in:
# `cargo build --features backend-llvm` (needs `LLVM_SYS_211_PREFIX` pointing at an LLVM
# 21.x install), or `--no-default-features --features backend-llvm` for LLVM alone.
[features]
default = ["backend-cranelift"]
backend-cranelift = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-object",
    "dep:cranelift-native",
]
backend-llvm = ["dep:inkwell"]
